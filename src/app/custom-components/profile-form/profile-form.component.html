<div class="dialog-container">
  <h2 class="dialog-title">{{data.isEdit ? 'Edit Profile' : 'Create Profile'}}</h2>
  
  <form [formGroup]="profileForm" (ngSubmit)="onSave()" class="profile-form">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" formControlName="fullName" placeholder="Enter your full name">
      <div *ngIf="profileForm.get('fullName')?.invalid && (profileForm.get('fullName')?.dirty || profileForm.get('fullName')?.touched)"
           class="error-message">
        <div *ngIf="profileForm.get('fullName')?.errors?.['minlength']">
          Full name must be at least 2 characters
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" formControlName="phone" placeholder="Enter your phone number">
      <div *ngIf="profileForm.get('phone')?.invalid && (profileForm.get('phone')?.dirty || profileForm.get('phone')?.touched)"
           class="error-message">
        <div *ngIf="profileForm.get('phone')?.errors?.['pattern']">
          Please enter a valid 10-digit phone number
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="college">College/Institution</label>
      <input type="text" id="college" formControlName="college" placeholder="Enter your college/institution">
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" formControlName="address" rows="3" placeholder="Enter your address"></textarea>
    </div>

    <div class="form-group">
      <label for="bio">Bio</label>
      <textarea id="bio" formControlName="bio" rows="4" placeholder="Tell us about yourself"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button type="submit" class="save-btn" (click)="onSave()">Save</button>
    </div>
  </form>
</div>
